# Production stack: PostgreSQL, the platform, HTTPS (Caddy, which also serves the public website) and nightly database backups.
# Start with: docker compose up -d --build      (settings come from .env — copy .env.example first)

# Images are pinned by digest: an update upstream changes nothing here until the digest is changed on purpose (Dependabot
# proposes new ones every month, .github/dependabot.yml).

# Container logs are capped (3 files of 10 MB per service), so they can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Two networks: the database and its helpers sit on "backend", which has no way out to the internet and which Caddy
# cannot reach; Caddy and the app share "frontend" (the app also sends email and notifications from there).
networks:
  backend:
    internal: true
  frontend:

services:
  db:
    logging: *logging
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    # No container may gain rights after it started (setuid programs and the like).
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    environment:
      POSTGRES_DB: shc
      POSTGRES_USER: shc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shc -d shc"]
      interval: 10s
      retries: 10
    # Not published to the internet: only the app container can reach it.

  # Before every start of the app: database changes (migrations/) are applied by the database owner, and the app's own
  # user is set up, which may only read and change rows (src/migrate.js). Then this container stops.
  migrate:
    logging: *logging
    build: .
    command: ["node", "src/migrate.js"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shc:${POSTGRES_PASSWORD}@db:5432/shc
      APP_DB_USER: shc_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  app:
    logging: *logging
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      # The app's own database user: rows only, no tables, roles or server files. Migrations ran in "migrate".
      DATABASE_URL: postgres://shc_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/shc
      MIGRATIONS: external
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      DOCUMENT_KEY: ${DOCUMENT_KEY:?Set DOCUMENT_KEY in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-http}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-SyriaHC}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_BLOCKED_PREFIXES: ${WHATSAPP_BLOCKED_PREFIXES:-+963,+53,+98,+850}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      MAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
      # Health file for patients: "on" only after the new privacy policy is published (docs/STUFE-2.md, decision 1).
      HEALTH_FILE: ${HEALTH_FILE:-off}
      # Notifications on phones and computers (Web Push). Empty = not offered. See README, "Notifications".
      PUSH_PUBLIC_KEY: ${PUSH_PUBLIC_KEY:-}
      PUSH_PRIVATE_KEY: ${PUSH_PRIVATE_KEY:-}
      PUSH_SUBJECT: ${PUSH_SUBJECT:-mailto:noreply@syriahc.com}
      # Video consultations: "on" only after the legal check. TURN relay: see README, "Video consultations".
      VIDEO: ${VIDEO:-off}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      STUN_URLS: ${STUN_URLS:-}
    volumes:
      - documents:/data/documents
    # Nothing but the documents volume and /tmp can be written, and the app has no Linux capabilities at all.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  caddy:
    logging: *logging
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    depends_on: [app]
    # Only the right to open ports 80 and 443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (QUIC) needs UDP: fewer round trips, better on slow and changing mobile networks. Also open it in ufw.
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      # Where old links to jobs and news are forwarded (the Syria Healthcare website, on GitHub Pages).
      NEWS_DOMAIN: ${NEWS_DOMAIN:-syriahealthcare.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The public website, published by website/update-website.sh (a fixed folder, so Caddy always sees the latest files).
      - /opt/www:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    logging: *logging
    # PostgreSQL's tools plus age, which encrypts the copies meant for outside the server (backup.Dockerfile).
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Public key (age1...) of the backup key pair; its secret half is kept by the operator, never on this server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./backups:/backups
      - documents:/documents:ro
    # Keeps its capabilities: the documents belong to the app's user and are readable by their owner only.
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    # Every night at about 02:00 server time: a compressed database dump and an archive of the (already encrypted)
    # documents, keeping the last 14 days. With BACKUP_AGE_RECIPIENT, also encrypted copies of both in backups/offsite/:
    # only those may leave the server, and only the holder of the secret key can open them (README, "Backups").
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077  # backups are readable by root only
        mkdir -p /backups/offsite
        while true; do
          sleep $$(( (26 - $$(date +%H)) % 24 * 3600 ))
          day=$$(date +%Y-%m-%d)
          pg_dump -h db -U shc -d shc -Fc -f /backups/shc-$$day.dump && echo "database backup ok"
          tar -czf /backups/documents-$$day.tar.gz -C /documents . && echo "documents backup ok"
          if [ -n "$$BACKUP_AGE_RECIPIENT" ]; then
            for name in shc-$$day.dump documents-$$day.tar.gz; do
              [ -s /backups/$$name ] || continue
              age -r "$$BACKUP_AGE_RECIPIENT" -o /backups/offsite/$$name.age.part /backups/$$name \
                && mv /backups/offsite/$$name.age.part /backups/offsite/$$name.age && echo "$$name encrypted for off-site copy"
            done
          else
            echo "BACKUP_AGE_RECIPIENT is not set: no encrypted copies for outside the server"
          fi
          find /backups \( -name 'shc-*.dump' -o -name 'documents-*.tar.gz' -o -name '*.age' -o -name '*.age.part' \) -mtime +14 -delete
          sleep 3600
        done

volumes:
  db-data:
  documents:
  caddy-data:
  caddy-config:
