# Production stack: PostgreSQL, the platform, HTTPS (Caddy) and nightly database backups.
# Start with: docker compose up -d --build      (settings come from .env — copy .env.example first)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shc
      POSTGRES_USER: shc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shc -d shc"]
      interval: 10s
      retries: 10
    # Not published to the internet: only the app container can reach it.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://shc:${POSTGRES_PASSWORD}@db:5432/shc
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      DOCUMENT_KEY: ${DOCUMENT_KEY:?Set DOCUMENT_KEY in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-http}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-SyriaHealth}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_BLOCKED_PREFIXES: ${WHATSAPP_BLOCKED_PREFIXES:-+963,+53,+98,+850}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      MAIL_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM in .env}
    volumes:
      - documents:/data/documents

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - documents:/documents:ro
    # Every night at about 02:00 server time: a compressed database dump and an archive of the
    # (already encrypted) licence documents, keeping the last 14 days.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (26 - $$(date +%H)) % 24 * 3600 ))
          pg_dump -h db -U shc -d shc -Fc -f /backups/shc-$$(date +%Y-%m-%d).dump && echo "database backup ok"
          tar -czf /backups/documents-$$(date +%Y-%m-%d).tar.gz -C /documents . && echo "documents backup ok"
          find /backups \( -name 'shc-*.dump' -o -name 'documents-*.tar.gz' \) -mtime +14 -delete
          sleep 3600
        done

volumes:
  db-data:
  documents:
  caddy-data:
  caddy-config:
