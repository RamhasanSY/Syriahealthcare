# Production stack: PostgreSQL, the platform, HTTPS (Caddy) and nightly database backups.
# Start with: docker compose up -d --build      (settings come from .env — copy .env.example first)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shc
      POSTGRES_USER: shc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shc -d shc"]
      interval: 10s
      retries: 10
    # Not published to the internet: only the app container can reach it.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://shc:${POSTGRES_PASSWORD}@db:5432/shc
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-http}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_TOKEN: ${SMS_HTTP_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-SyriaHealth}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    # Every night at about 02:00 server time: a compressed dump, keeping the last 14 days.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep $$(( (26 - $$(date +%H)) % 24 * 3600 ))
          pg_dump -h db -U shc -d shc -Fc -f /backups/shc-$$(date +%Y-%m-%d).dump && echo "backup ok"
          find /backups -name 'shc-*.dump' -mtime +14 -delete
          sleep 3600
        done

volumes:
  db-data:
  caddy-data:
  caddy-config:
