<!doctype html>
<html lang="ar" dir="rtl" data-title-en="Duty times — SyriaHC" data-title-ar="أوقات المناوبة — صحة تك">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1a3a5c">
<title>أوقات المناوبة — صحة تك</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css">
<script src="/assets/common.js" defer></script><script src="/assets/duties.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-en="Skip to content" data-ar="انتقل إلى المحتوى">انتقل إلى المحتوى</a>
<header class="top"><div class="top-inner"><a class="brand" href="/account"><img src="/assets/logo.svg" alt=""><span data-en="SyriaHC" data-ar="صحة تك">صحة تك</span></a><div class="top-actions"><button class="lang" id="langToggle" type="button">English</button></div></div></header>
<main id="main" class="wrap wide" aria-busy="true">
  <h1 data-en="Duty times" data-ar="أوقات المناوبة">أوقات المناوبة</h1>
  <p class="lead" data-en="Enter your night and holiday duties. They appear on app.syriahc.com/on-duty once your pharmacy is approved. Pharmacies open 24 hours mark this in their profile instead." data-ar="أدخلوا مناوباتكم الليلية وفي العطل. تظهر على app.syriahc.com/on-duty بعد اعتماد صيدليتكم. أما الصيدليات المفتوحة على مدار الساعة فتحدد ذلك في ملفها.">أدخلوا مناوباتكم الليلية وفي العطل. تظهر على app.syriahc.com/on-duty بعد اعتماد صيدليتكم. أما الصيدليات المفتوحة على مدار الساعة فتحدد ذلك في ملفها.</p>
  <div class="msg info" id="notApproved" hidden data-en="Your pharmacy is not approved yet: the duties are saved but not shown to the public." data-ar="لم تُعتمد صيدليتكم بعد: تُحفظ المناوبات لكنها لا تظهر للعموم.">لم تُعتمد صيدليتكم بعد: تُحفظ المناوبات لكنها لا تظهر للعموم.</div>
  <div class="msg error" id="pageError" role="alert" tabindex="-1" hidden></div>
  <section class="card wide-card" id="addCard" hidden aria-labelledby="addTitle">
    <h2 id="addTitle" data-en="Add a duty" data-ar="أضف مناوبة">أضف مناوبة</h2>
    <form id="addForm" novalidate>
      <div class="field-row">
        <label class="field"><span data-en="Day" data-ar="اليوم">اليوم</span><input type="date" id="date" required></label>
        <label class="field"><span data-en="From" data-ar="من">من</span><input type="time" id="from" value="20:00" required></label>
        <label class="field"><span data-en="To" data-ar="إلى">إلى</span><input type="time" id="to" value="08:00" required><small data-en="Earlier than the start: ends the next morning." data-ar="إذا كان قبل البداية: تنتهي صباح اليوم التالي.">إذا كان قبل البداية: تنتهي صباح اليوم التالي.</small></label>
      </div>
      <div class="field-row two">
        <label class="field"><span data-en="Repeat every week" data-ar="التكرار أسبوعياً">التكرار أسبوعياً</span><select id="repeat"></select></label>
        <label class="field"><span data-en="Note (optional)" data-ar="ملاحظة (اختياري)">ملاحظة (اختياري)</span><input type="text" id="note" maxlength="120" dir="auto"></label>
      </div>
      <button class="btn" type="submit" id="add" data-en="Add" data-ar="إضافة">إضافة</button>
    </form>
  </section>
  <p class="results-count" id="announce" role="status" tabindex="-1"></p>
  <ul class="appt-list" id="list"></ul>
</main>
<footer><div class="wrap"><a href="/account" data-en="← My account" data-ar="حسابي ←">حسابي ←</a><a href="/on-duty" data-en="Public list" data-ar="القائمة العامة">القائمة العامة</a></div></footer>
</body>
</html>
