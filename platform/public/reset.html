<!doctype html>
<html lang="ar" dir="rtl" data-title-en="Choose a new password — Syria Healthcare" data-title-ar="اختر كلمة مرور جديدة — الرعاية الصحية في سوريا">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173e36">
<meta name="referrer" content="no-referrer">
<title>اختر كلمة مرور جديدة — الرعاية الصحية في سوريا</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/app.css">
<script src="/assets/common.js" defer></script><script src="/assets/password.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-en="Skip to content" data-ar="انتقل إلى المحتوى">انتقل إلى المحتوى</a>
<header class="top"><div class="top-inner"><a class="brand" href="/"><img src="/assets/logo.svg" alt=""><span data-en="Syria Healthcare" data-ar="الرعاية الصحية في سوريا">الرعاية الصحية في سوريا</span></a><div class="top-actions"><button class="lang" id="langToggle" type="button">English</button></div></div></header>
<main id="main" class="wrap">
  <h1 data-en="Choose a new password" data-ar="اختر كلمة مرور جديدة">اختر كلمة مرور جديدة</h1>
  <p class="lead" data-en="After saving, every device signed in to your account is signed out." data-ar="بعد الحفظ يُسجَّل الخروج من كل الأجهزة المتصلة بحسابك.">بعد الحفظ يُسجَّل الخروج من كل الأجهزة المتصلة بحسابك.</p>
  <form class="card" id="resetForm" novalidate>
    <div class="msg error" id="resetError" role="alert" tabindex="-1" hidden></div>
    <p id="resetAgain" hidden><a href="/forgot" data-en="Request a new link" data-ar="اطلب رابطاً جديداً">اطلب رابطاً جديداً</a></p>
    <label class="field"><span data-en="New password" data-ar="كلمة المرور الجديدة">كلمة المرور الجديدة</span><input type="password" id="resetPassword" autocomplete="new-password" minlength="10" dir="ltr" required aria-describedby="resetHint"><small id="resetHint" data-en="At least 10 characters. A short sentence is easy to remember." data-ar="10 أحرف على الأقل. جملة قصيرة يسهل تذكرها.">10 أحرف على الأقل. جملة قصيرة يسهل تذكرها.</small></label>
    <label class="field"><span data-en="Repeat the new password" data-ar="أعد كتابة كلمة المرور الجديدة">أعد كتابة كلمة المرور الجديدة</span><input type="password" id="resetRepeat" autocomplete="new-password" dir="ltr" required></label>
    <button class="btn" type="submit" id="resetButton" data-en="Save and sign in" data-ar="احفظ وسجّل الدخول">احفظ وسجّل الدخول</button>
  </form>
</main>
<footer><div class="wrap"><a href="/staff" data-en="Back to sign-in" data-ar="العودة إلى تسجيل الدخول">العودة إلى تسجيل الدخول</a><a href="/privacy" data-en="Privacy policy" data-ar="سياسة الخصوصية">سياسة الخصوصية</a></div></footer>
</body>
</html>
