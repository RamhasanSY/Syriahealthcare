name: Platform tests

on:
  push:
    paths: ['platform/**', '.github/workflows/platform.yml']
  pull_request:
    paths: ['platform/**', '.github/workflows/platform.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: shc_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/shc_test
          # As in production: the app runs as a database user that may only read and change rows (src/migrate.js).
          TEST_APP_ROLE: '1'
          # test/fhir-examples.test.js writes one example of every FHIR resource here, for the validator below.
          FHIR_EXAMPLES_DIR: ${{ github.workspace }}/platform/fhir-examples
      # The official HL7 FHIR validator checks every example against FHIR R4 (no terminology server: our own
      # code systems live in the platform, and the validator must never call out with our data).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: HL7 FHIR validator
        run: |
          # A fixed release with its checksum: a changed or replaced file upstream cannot run here unnoticed.
          curl -sSfL -o validator_cli.jar https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.5/validator_cli.jar
          echo "9dfe9f305b0f9389eceade2a4a1c9a2740d7b0e614066fdf07a78b571c76d92f  validator_cli.jar" | sha256sum -c -
          java -jar validator_cli.jar fhir-examples -version 4.0.1 -tx n/a
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fhir-examples
          path: platform/fhir-examples
          if-no-files-found: ignore

  # The production stack as docker-compose.yml starts it on the server: migrations by the database owner, the app as the
  # restricted database user on a read-only file system without capabilities, the database out of Caddy's reach, and
  # backup copies that only the holder of the secret key can open.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Start database, migrations, app and backup
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-postgres-password-0123456789
          APP_DB_PASSWORD=ci-app-password-0123456789abcdef
          APP_DOMAIN=app.example.org
          SITE_DOMAIN=example.org
          OTP_SECRET=ci-otp-secret-0123456789abcdef0123456789
          DOCUMENT_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SMS_PROVIDER=none
          SMTP_HOST=smtp.example.org
          SMTP_USER=ci@example.org
          SMTP_PASSWORD=not-used
          MAIL_FROM=SyriaHC <ci@example.org>
          EOF
          docker compose up -d --build --wait app backup
      - name: Migrations ran as the owner, the app runs as shc_app, which is no superuser
        run: |
          docker compose logs migrate | tee /dev/stderr | grep -q 'may read and change rows only'
          test "$(docker compose exec -T db psql -U shc -d shc -tAc "SELECT rolsuper FROM pg_roles WHERE rolname = 'shc_app'")" = f
          # The health check queries the database; its pooled connection stays open for 10 seconds.
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/health
          test "$(docker compose exec -T db psql -U shc -d shc -tAc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'shc_app'")" -gt 0
          test "$(docker compose exec -T db psql -U shc -d shc -tAc "SELECT count(*) FROM pg_stat_activity WHERE usename = 'shc' AND application_name <> 'psql'")" -eq 0
      - name: The app cannot write its own files and has no capabilities; Caddy cannot reach the database
        run: |
          if docker compose exec -T app touch /app/src/x; then echo "the app could change its code"; exit 1; fi
          docker compose exec -T app grep -q 'CapEff:.0000000000000000' /proc/self/status
          docker compose run --rm --no-deps -T --entrypoint sh caddy -c 'command -v nc >/dev/null && ! nc -z -w 3 db 5432'
      - name: The nightly loop runs, and an encrypted copy opens with the secret key only
        run: |
          sleep 5
          test "$(docker compose ps backup --format '{{.State}}')" = running
          docker compose run --rm --no-deps -T --entrypoint age-keygen backup > key.txt
          recipient=$(grep -o 'age1[0-9a-z]*' key.txt)
          docker compose exec -T -e RECIPIENT="$recipient" backup sh -c 'pg_dump -h db -U shc -d shc -Fc | age -r "$RECIPIENT"' > shc.dump.age
          if grep -aq 'CREATE TABLE' shc.dump.age; then echo "the copy is not encrypted"; exit 1; fi
          docker compose run --rm --no-deps -T -v "$PWD:/k:ro" --entrypoint age backup -d -i /k/key.txt /k/shc.dump.age > shc.dump
          docker compose exec -T db pg_restore -l < shc.dump | grep -q 'TABLE public users'
      - if: failure()
        run: docker compose ps -a; docker compose logs --tail 50
