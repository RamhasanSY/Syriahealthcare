name: Website checks

# The website is published by the company server (platform/website/update-website.sh), not by GitHub.
# This only checks that the collector tests pass and the pages still build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate browser script
        run: node --check assets/app.js
      - name: Build pages
        run: node scripts/build.mjs
