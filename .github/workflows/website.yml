name: Website checks

# The website is published by the company server (platform/website/update-website.sh), not by GitHub.
# This only checks that the collector tests pass and the pages still build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate browser script
        run: node --check assets/app.js
      - name: Build pages
        run: node scripts/build.mjs
