name: Update news and jobs

on:
  schedule:
    # 06:00 and 18:00 UTC — GitHub cron is always UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the updated JSON files

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and filter
        id: collect
        continue-on-error: true
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "syriahealthcare-bot"
          git config user.email "actions@github.com"
          git add data/news.json data/news.xml data/jobs.json data/status.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update news and jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A content section has no reachable sources. Only previously verified, unexpired records within the retention window remain. See source status above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
