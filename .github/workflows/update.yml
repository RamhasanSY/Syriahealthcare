name: Update news and jobs

on:
  schedule:
    # Twice daily: 06:17 and 18:17 UTC. Avoid the busy start of each hour.
    - cron: "17 6,18 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # needed to commit the updated JSON files

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Collect and filter
        id: collect
        continue-on-error: true
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "syriahealthcare-bot"
          git config user.email "actions@github.com"
          git add data/news.json data/news.xml data/jobs.json data/status.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update news and jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Only the new, unpublished bot commit is rebased.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 5
            done
            echo "Could not push collected data after three attempts." >&2
            exit 1
          fi

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "A content section has no reachable sources. Only previously verified, unexpired records within the retention window remain. See source status above." >> "$GITHUB_STEP_SUMMARY"
          exit 1
