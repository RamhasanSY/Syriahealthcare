name: Publish Syria Healthcare

# Publishes the jobs and news website (dist-news/, Syria Healthcare) on GitHub Pages at syriahealthcare.com, after every
# push to main and after every news and jobs collection. SyriaHC (dist/, syriahc.com) is published by the company
# server instead (platform/website/update-website.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update news and jobs]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Validate collector
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate browser script
        run: node --check assets/app.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - name: Build the websites
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist-news
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
