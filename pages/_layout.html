<!doctype html>
<html lang="en" dir="ltr" data-title-en="{{title}}" data-title-ar="{{title_ar}}" data-desc-en="{{description}}" data-desc-ar="{{description_ar}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173e36">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:type" content="website">
  <link rel="canonical" href="{{url}}">
  <meta property="og:url" content="{{url}}"><meta property="og:site_name" content="Syria Healthcare">
  <meta property="og:image" content="https://syriahealthcare.com/assets/social-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="Syria Healthcare: healthcare and humanitarian opportunities in Syria, with a jasmine and courtyard arch logo.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="alternate" type="application/rss+xml" title="Syria Healthcare news" href="https://syriahealthcare.com/data/news.xml">
  <link rel="alternate" type="application/rss+xml" title="Syria Healthcare jobs" href="https://syriahealthcare.com/data/jobs.xml">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Syria Health">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css?v={{version}}"><script src="assets/app.js?v={{version}}" defer></script>
</head>
<body>
<a class="skip-link" href="#main" data-en="Skip to content" data-ar="انتقل إلى المحتوى">Skip to content</a>
<div class="utility"><div class="wrap"><span data-en="An independent window into Syria’s health & humanitarian sector" data-ar="نافذة مستقلة على القطاع الصحي والإنساني في سوريا">An independent window into Syria’s health & humanitarian sector</span><a href="about.html#sources"><span class="dot"></span><span data-en="Checked twice daily" data-ar="تُفحص المصادر مرتين يومياً">Checked twice daily</span></a></div></div>
<header class="masthead"><div class="wrap masthead-inner">
  <a class="wordmark" href="./"><img class="brand-symbol" src="assets/logo.svg" width="52" height="52" alt=""><span><span class="wordmark-en">Syria Healthcare<span>.</span></span><span class="wordmark-ar" lang="ar">الرعاية الصحية في سوريا</span></span></a>
  <nav class="header-nav" aria-label="Main navigation" data-label-en="Main navigation" data-label-ar="التنقل الرئيسي">{{nav}}</nav>
  <button class="lang-toggle" id="langToggle" type="button" lang="ar">العربية</button>
</div></header>
<main id="main">
{{content}}
<noscript><p class="wrap">Enable JavaScript to load jobs, news and directories. / فعّل جافاسكريبت لعرض الوظائف والأخبار والأدلة.</p></noscript>
</main>
<footer class="colophon"><div class="wrap footer-inner"><a class="footer-brand" href="./"><img src="assets/logo.svg" width="32" height="32" alt=""><span class="footer-wordmark">Syria Healthcare<span>.</span></span></a><span data-en="Connecting people with purpose." data-ar="نصل الناس بفرص هادفة.">Connecting people with purpose.</span><a href="#main" data-en="Back to top ↑" data-ar="العودة للأعلى ↑">Back to top ↑</a></div><div class="wrap install-app" id="installApp" hidden><button class="button secondary" id="installButton" type="button" hidden data-en="Install the app on this device" data-ar="ثبّت التطبيق على هذا الجهاز">Install the app on this device</button><p id="installIos" hidden data-en="Use it like an app: tap Share, then “Add to Home Screen”." data-ar="استخدمه كتطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».">Use it like an app: tap Share, then “Add to Home Screen”.</p></div><div class="wrap footer-nav"><nav aria-label="All pages" data-label-en="All pages" data-label-ar="جميع الصفحات">{{footer_nav}}</nav></div></footer>
</body></html>
