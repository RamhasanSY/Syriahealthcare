<!doctype html>
<html lang="en" dir="ltr" data-site="{{site}}" data-title-en="{{title}}" data-title-ar="{{title_ar}}" data-desc-en="{{description}}" data-desc-ar="{{description_ar}}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="{{theme_color}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{title}}"><meta property="og:description" content="{{description}}"><meta property="og:type" content="website">
  <link rel="canonical" href="{{url}}">
  <meta property="og:url" content="{{url}}"><meta property="og:site_name" content="{{brand}}">
  <meta property="og:image" content="{{site_url}}assets/social-card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:image:alt" content="{{og_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  {{feeds}}
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="{{brand}}">
  <link rel="icon" href="assets/favicon.svg?v={{favicon_version}}" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css?v={{version}}"><script src="assets/app.js?v={{version}}" defer></script>
</head>
<body>
<a class="skip-link" href="#main" data-en="Skip to content" data-ar="انتقل إلى المحتوى">Skip to content</a>
<div class="utility"><div class="wrap">{{utility}}</div></div>
<header class="masthead"><div class="wrap masthead-inner">
  <a class="wordmark" href="./"><img class="brand-symbol" src="assets/logo.svg" width="52" height="52" alt=""><span>{{wordmark}}</span></a>
  <nav class="header-nav" aria-label="Main navigation" data-label-en="Main navigation" data-label-ar="التنقل الرئيسي">{{nav}}</nav>
  <button class="lang-toggle" id="langToggle" type="button" lang="ar">العربية</button>
</div></header>
<main id="main">
{{content}}
<noscript><p class="wrap">Enable JavaScript to load jobs, news and directories. / فعّل جافاسكريبت لعرض الوظائف والأخبار والأدلة.</p></noscript>
</main>
<footer class="colophon"><div class="wrap footer-inner"><a class="footer-brand" href="./"><img src="assets/logo.svg" width="32" height="32" alt=""><span class="footer-wordmark">{{footer_wordmark}}</span></a><span data-en="Connecting people with purpose." data-ar="نصل الناس بفرص هادفة.">Connecting people with purpose.</span><a href="#main" data-en="Back to top ↑" data-ar="العودة للأعلى ↑">Back to top ↑</a></div><div class="wrap install-app" id="installApp" hidden><button class="button secondary" id="installButton" type="button" hidden data-en="Install the app on this device" data-ar="ثبّت التطبيق على هذا الجهاز">Install the app on this device</button><p id="installIos" hidden data-en="Use it like an app: tap Share, then “Add to Home Screen”." data-ar="استخدمه كتطبيق: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».">Use it like an app: tap Share, then “Add to Home Screen”.</p></div><div class="wrap footer-nav"><nav aria-label="All pages" data-label-en="All pages" data-label-ar="جميع الصفحات">{{footer_nav}}</nav></div></footer>
</body></html>
